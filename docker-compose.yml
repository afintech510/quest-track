services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_FAMILY_ID: ${VITE_FAMILY_ID}
    container_name: questtrack_web
    restart: unless-stopped
    networks:
      - hosthampton_hampton_net

networks:
  hosthampton_hampton_net:
    external: true
